plugins {
    id 'java'
    id 'application'
}

group = 'registration'
version = '1.0'

repositories {
    mavenCentral()
}

// Компилируем под Java 17, запускать можно на любом JDK 17+
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

application {
    mainClass = 'registration.Main'
}

// Чтобы Scanner получал ввод с клавиатуры при запуске через `gradle run`
run {
    standardInput = System.in
}
